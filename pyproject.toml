[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-engine-pro"
version = "0.1.0"
description = "Telegram-бот XAU Engine Pro: зоны входа XAUUSD по стратегии Mr. Casino"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
xau-engine = "xau_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
